<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SalesForce UI</title>
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="main">
      <div id="header">
        <div id="logo">
          <img
            src="https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/Salesforce.com_logo.svg/960px-Salesforce.com_logo.svg.png?utm_source=en.wikipedia.org&utm_campaign=imageinfo&utm_content=thumbnail"
            alt=""
          />
        </div>
        <div class="texts"><p>Products</p></div>
        <div class="texts"><p>Industries</p></div>
        <div class="texts"><p>Customers</p></div>
        <div class="texts"><p>Learning</p></div>
        <div class="texts"><p>Support</p></div>
        <div class="texts">
          <p>More</p>
          <i class="ri-arrow-down-s-line"></i>
        </div>
        <div id="conteactDetails">
          <p style="text-align: center"><u>Contact Us</u></p>
          <p>0000-000-0000</p>
        </div>
        <div class="icon"><i class="ri-search-line"></i></div>
        <div class="icon"><i class="ri-global-line"></i></div>
        <div id="login"><i class="ri-user-3-fill"></i><p>Login</p>
        </div>
        <div id="try"><p>Try For Free</p></div>
      </div>
      <div id="fakeHeader"></div>
      <div id="page1">
        <div id="strip">
          <p>JUST ANNOUNCED: See why Gartner recognised Salesforce as a Leader in Customer Data Platforms. <u>Read the report</u>
          </p></div>
        <div id="content">
          <div id="box1"></div>
          <div id="box2"></div>
        </div>
        <div id="heading"><h>Learn what Salesforce products can do for you.</h></div>
      </div>
      <div id="page2"></div>
    </div>
  </body>
</html>
